# Render Blueprint: license server (Flask) + managed Postgres (free tier).
#
# rootDir points at license_server/ so Render reads THIS folder's
# requirements.txt and runs gunicorn from here, not the project root.
#
# Postgres replaces the earlier SQLite-on-ephemeral-/tmp setup. Postgres on
# Render's free tier is persistent (1 GB included) — keys survive deploys and
# container restarts. DATABASE_URL is injected automatically via `fromDatabase`.
databases:
  - name: amazon-scraper-license-db
    plan: free
    databaseName: licenses
    user: licenses_app

services:
  - type: web
    name: amazon-scraper-license
    runtime: python
    plan: free
    rootDir: license_server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: LICENSE_SIGNING_SECRET
        generateValue: true
      - key: LICENSE_ADMIN_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: amazon-scraper-license-db
          property: connectionString
