# Render Blueprint: license server (Flask) only. Database is Supabase Postgres
# (external), not a Render-managed database.
#
# rootDir points at license_server/ so Render reads THIS folder's
# requirements.txt and runs gunicorn from here, not the project root.
#
# DATABASE_URL is NOT auto-injected here (no `fromDatabase` — that only works
# for Render-managed databases). Set it manually in the Render dashboard:
# Service → Environment → DATABASE_URL = the Supabase "Session pooler"
# connection string (Project Settings → Database → Connection string →
# Session pooler tab), with the real password substituted for
# [YOUR-PASSWORD]. Do NOT use the direct db.<ref>.supabase.co host — it's
# IPv6-only and unreachable from Render's free web services. Never commit
# the resolved value here.
services:
  - type: web
    name: amazon-scraper-license
    runtime: python
    plan: free
    rootDir: license_server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: LICENSE_SIGNING_SECRET
        generateValue: true
      - key: LICENSE_ADMIN_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
