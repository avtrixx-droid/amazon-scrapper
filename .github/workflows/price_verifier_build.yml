name: Build Price Verification Tool (Windows)

# Separate from build.yml on purpose — price_verifier/ is an independent
# tool (see CLAUDE.md's price_verifier/ note) with no license system and no
# secrets to bake in, so it gets its own simpler pipeline rather than a
# third job bolted onto the scraper's build. Path-filtered so an unrelated
# scraper.py commit doesn't trigger a rebuild, and no `branches:` filter so
# it runs on every push to every branch that touches these files — "ready
# right after commit," not just after merging to main.

on:
  push:
    paths:
      - "price_verifier/**"
      - "price_verifier_windows.spec"
      - "build_price_verifier_windows.bat"
      - ".github/workflows/price_verifier_build.yml"
  workflow_dispatch:       # allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r price_verifier/requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Run offline test suite (build gate)
        timeout-minutes: 20   # includes the fake-Amazon end-to-end runs (~1 min)
        run: python -m unittest discover -s price_verifier/tests -p "test_*.py"

      # Same license server as the Amazon Scraper build (repository secret
      # LICENSE_SERVER_URL). Only the URL is baked in — the client needs no
      # secret. Without the secret the app uses licensing.DEFAULT_SERVER_URL.
      - name: Bake license server URL into build
        env:
          LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL }}
        run: python -c "import os; open('price_verifier/_build_config.py', 'w', encoding='utf-8').write('# Auto-generated by CI - DO NOT COMMIT\nSERVER_URL = %r\n' % os.environ.get('LICENSE_SERVER_URL', '').strip())"

      - name: Build .exe
        run: pyinstaller price_verifier_windows.spec --clean --noconfirm

      - name: Assemble release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\Release_Windows | Out-Null
          Copy-Item dist\PriceVerificationTool.exe dist\Release_Windows\
          Copy-Item price_verifier\README.md dist\Release_Windows\

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: PriceVerificationTool-Windows
          path: dist\Release_Windows\
          retention-days: 30

  # ── End-to-end on real Windows ──────────────────────────────────────────
  # Builds a TEST .exe wired to a local fake license server and drives it
  # like the vendor does (tests/e2e_frozen.py): activate -> upload -> run ->
  # results -> download, against the local fake Amazon, with rows only a real
  # Chrome can price, so the Chrome check (undetected-chromedriver, which
  # starts Chrome through multiprocessing) runs inside the frozen, windowed
  # .exe. Fails if the app process dies or a second copy starts answering on
  # its port. The app's logs are uploaded either way.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r price_verifier/requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build a test .exe wired to the fake license server
        run: |
          python -c "open('price_verifier/_build_config.py', 'w').write('SERVER_URL = ' + repr('http://127.0.0.1:8123') + chr(10))"
          pyinstaller price_verifier_windows.spec --clean --noconfirm --distpath dist-e2e --workpath build-e2e

      - name: Installed Chrome
        shell: pwsh
        run: (Get-Item "C:\Program Files\Google\Chrome\Application\chrome.exe").VersionInfo.ProductVersion

      - name: End-to-end journey on the built .exe
        run: python -m price_verifier.tests.e2e_frozen --exe dist-e2e\PriceVerificationTool.exe --expect-chrome --artifacts e2e-artifacts

      - name: Upload app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-logs
          path: e2e-artifacts\
          retention-days: 14
