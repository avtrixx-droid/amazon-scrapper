<!doctype html><html lang="en" class="a-no-js"><head>
<meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge">
<title dir="ltr">Amazon.in</title>
<meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="https://images-na.ssl-images-amazon.com/images/G/01/AUIClients/AmazonUI-3c913031596ca78a3768f4e934b1cc02ce238101.secure.min._V1_.css">
</head>
<body>
<div class="a-container a-padding-double-large" style="min-width:350px;padding:44px 0 !important">
  <div class="a-row a-spacing-double-large" style="width: 350px; margin: 0 auto">
    <div class="a-row a-spacing-medium a-text-center"><i class="a-icon a-logo"></i></div>
    <div class="a-box a-alert a-alert-info a-spacing-base"><div class="a-box-inner">
      <i class="a-icon a-icon-alert"></i>
      <h4>Enter the characters you see below</h4>
      <p class="a-last">Sorry, we just need to make sure you're not a robot. For best results, please make sure your browser is accepting cookies.</p>
    </div></div>
    <div class="a-section">
      <div class="a-box a-color-offset-background"><div class="a-box-inner a-padding-extra-large">
        <form method="get" action="/errors/validateCaptcha" name="">
          <input type=hidden name="amzn" value="abc123==" /><input type=hidden name="amzn-r" value="&#047;dp&#047;B0GLOTY001" />
          <div class="a-row a-spacing-large"><div class="a-box"><div class="a-box-inner">
            <h4>Type the characters you see in this image:</h4>
            <div class="a-row a-text-center"><img src="https://images-na.ssl-images-amazon.com/captcha/xyz/Captcha_abc.jpg"></div>
            <div class="a-row a-spacing-base"><div class="a-row"><div class="a-column a-span6"><label for="captchacharacters">Type characters</label></div></div>
              <input autocomplete="off" spellcheck="false" placeholder="Type characters" id="captchacharacters" name="field-keywords" class="a-span12" autocapitalize="off" autocorrect="off" type="text">
            </div>
          </div></div></div>
          <div class="a-section a-spacing-extra-large"><span class="a-button a-button-primary a-span12"><span class="a-button-inner"><button type="submit" class="a-button-text">Continue shopping</button></span></span></div>
        </form>
      </div></div>
    </div>
  </div>
</div>
</body></html>
